<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Grauton Elektrotechnik Holcmann</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#161616;
    --charcoal:#2b2b2b;
    --graphite:#5c5c5c;
    --steel:#9a9a9a;
    --fog:#e7e7e5;
    --paper:#f5f5f3;
    --live:#f2c14e; /* Spannungs-Gelb */
  }

  *{box-sizing:border-box; margin:0; padding:0;}

  html,body{
    height:100%;
    background:var(--paper);
    color:var(--ink);
    font-family:'Space Grotesk', sans-serif;
    overflow-x:hidden;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    min-height:100vh;
    position:relative;
    padding:32px;
  }

  /* dezentes Schaltplan-Raster im Hintergrund */
  .grid-bg{
    position:fixed;
    inset:0;
    background-image:
      linear-gradient(var(--fog) 1px, transparent 1px),
      linear-gradient(90deg, var(--fog) 1px, transparent 1px);
    background-size:48px 48px;
    opacity:0.6;
    z-index:0;
  }

  /* Warnstreifen-Ecke oben links – Anspielung auf Elektro-Absperrband */
  .hazard-corner{
    position:fixed;
    top:0; left:0;
    width:180px; height:180px;
    overflow:hidden;
    z-index:2;
    pointer-events:none;
  }
  .hazard-corner::before{
    content:"";
    position:absolute;
    top:26px; left:-60px;
    width:260px; height:34px;
    background:repeating-linear-gradient(
      45deg,
      var(--ink) 0 14px,
      var(--live) 14px 28px
    );
    transform:rotate(-45deg);
    box-shadow:0 0 0 1px rgba(0,0,0,0.05);
  }

  .card{
    position:relative;
    z-index:1;
    max-width:640px;
    width:100%;
    text-align:center;
  }

  .eyebrow{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'JetBrains Mono', monospace;
    font-size:12px;
    letter-spacing:0.18em;
    text-transform:uppercase;
    color:var(--graphite);
    margin-bottom:28px;
  }

  .dot{
    width:8px; height:8px;
    border-radius:50%;
    background:var(--live);
    box-shadow:0 0 0 0 rgba(242,193,78,0.6);
    animation:pulse 1.8s infinite;
  }

  @keyframes pulse{
    0%{ box-shadow:0 0 0 0 rgba(242,193,78,0.55); }
    70%{ box-shadow:0 0 0 10px rgba(242,193,78,0); }
    100%{ box-shadow:0 0 0 0 rgba(242,193,78,0); }
  }

  h1{
    font-size:clamp(2.4rem, 7vw, 4.4rem);
    line-height:0.98;
    font-weight:700;
    letter-spacing:-0.01em;
    color:var(--ink);
  }

  h1 span{
    display:block;
    font-size:0.32em;
    font-weight:500;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--graphite);
    margin-top:14px;
  }

  .divider{
    width:100%;
    max-width:280px;
    height:10px;
    margin:36px auto;
    position:relative;
  }
  .divider svg{ width:100%; height:100%; display:block; }
  .divider path{
    stroke:var(--steel);
    stroke-width:1.5;
    fill:none;
  }
  .divider circle{
    fill:var(--live);
  }

  .status{
    font-size:1.05rem;
    color:var(--charcoal);
    margin-bottom:6px;
  }

  .status strong{
    font-weight:600;
  }

  .sub{
    font-family:'JetBrains Mono', monospace;
    font-size:13px;
    color:var(--steel);
    letter-spacing:0.02em;
  }

  footer{
    position:fixed;
    bottom:22px; left:0; right:0;
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-size:11px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--steel);
    z-index:1;
  }

  @media (prefers-reduced-motion: reduce){
    .dot{ animation:none; }
  }
</style>
</head>
<body>

  <div class="grid-bg"></div>
  <div class="hazard-corner"></div>

  <main class="card">
    <div class="eyebrow"><span class="dot"></span> Seite im Aufbau</div>

    <h1>GRAUTON
      <span>Elektrotechnik Holcmann</span>
    </h1>

    <div class="divider">
      <svg viewBox="0 0 280 10" preserveAspectRatio="none">
        <path d="M0,5 H110 M170,5 H280"></path>
        <circle cx="140" cy="5" r="4"></circle>
      </svg>
    </div>

    <p class="status"><strong>Wir sind gerade dabei, Ihre neue Website ans Netz zu bringen.</strong></p>
    <p class="sub">Schauen Sie bald wieder vorbei.</p>
  </main>

  <footer>&copy; 2026 Grauton Elektrotechnik Holcmann</footer>

</body>
</html>
